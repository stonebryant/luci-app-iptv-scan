name: Build OpenWrt APK Package (Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget

    - name: Build Package
      id: compile
      run: |
        # 请根据你的设备情况修改此处配置
        # --------------------------------------------------------------
        TARGET_ARCH="aarch64_cortex-a53"       # CPU 架构
        OPENWRT_VERSION="23.05.4"              # 稳定版本号，请确认存在
        TARGET="armsr/armv8"                   # 目标平台
        # --------------------------------------------------------------

        SDK_DIR="openwrt-sdk"
        mkdir -p "$SDK_DIR"
        cd "$SDK_DIR" || exit 1

        SDK_URL="https://downloads.immortalwrt.org/${OPENWRT_VERSION}/targets/${TARGET}/"
        echo "正在下载 SDK 文件列表..."
        wget -q --show-progress -O sha256sums "${SDK_URL}sha256sums"

        SDK_FILE=$(grep -oP 'openwrt-sdk-[0-9.]+-armsr-armv8_gcc-[0-9.]+_musl.Linux-x86_64.tar.xz' sha256sums | head -1)
        if [ -z "$SDK_FILE" ]; then
          echo "错误：未找到 SDK 文件"
          exit 1
        fi

        echo "找到 SDK 文件: $SDK_FILE，开始下载..."
        wget -q --show-progress -O sdk.tar.xz "${SDK_URL}${SDK_FILE}"
        tar -xJf sdk.tar.xz --strip-components=1
        rm -f sdk.tar.xz sha256sums

        echo "SDK 下载并解压完成。开始集成插件源码..."
        rm -rf package/luci-app-iptv-scan
        cp -r "${GITHUB_WORKSPACE}" package/luci-app-iptv-scan

        echo "更新 feeds..."
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        echo "正在配置并编译插件..."
        echo "CONFIG_PACKAGE_luci-app-iptv-scan=m" >> .config
        make defconfig
        make package/luci-app-iptv-scan/compile V=s

        echo "查找编译好的 APK 文件..."
        find bin/ -name "luci-app-iptv-scan*.apk" -exec cp {} /tmp/ \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-iptv-scan_${{ github.run_number }}
        path: /tmp/luci-app-iptv-scan*.apk
        if-no-files-found: error
